<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Chat</title>
<style>
  :root {
    --bg: #f0f2f5; --card: #fff; --me: #2b7de9; --me-text: #fff;
    --other: #e9ecef; --text: #1d2129; --muted: #7b8794; --border: #dde1e6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1e2229; --other: #2a303a; --text: #e8eaed; --muted: #8b95a1; --border: #2f3640; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; align-items: center;
  }
  .app {
    width: 100%; max-width: 640px; height: 100%; max-height: 800px;
    background: var(--card); display: flex; flex-direction: column;
    border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
  }
  @media (max-width: 640px) { .app { max-height: none; border-radius: 0; border: 0; } }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { font-size: 16px; margin: 0; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #e5534b; }
  .dot.on { background: #2ea043; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex;
    flex-direction: column; gap: 8px;
  }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 14px; background: var(--other); word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
  .msg.other { align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg .name { font-size: 12px; font-weight: 600; margin-bottom: 2px; opacity: .8; }
  .msg .time { font-size: 10px; opacity: .6; margin-top: 2px; text-align: right; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  input, button { font: inherit; }
  input[type=text] {
    flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); outline: none;
  }
  input[type=text]:focus { border-color: var(--me); }
  button {
    padding: 10px 18px; border: 0; border-radius: 20px; background: var(--me);
    color: #fff; cursor: pointer; font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  /* kirish oynasi */
  #login {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  #login .box {
    background: var(--card); padding: 24px; border-radius: 12px; width: 100%; max-width: 340px;
    display: flex; flex-direction: column; gap: 12px;
  }
  #login h2 { margin: 0 0 4px; }
  #login label { font-size: 13px; color: var(--muted); }
  #login input { border-radius: 8px; }
  #login button { border-radius: 8px; }
</style>
</head>
<body>

<div id="login">
  <form class="box" id="loginForm" style="border:0">
    <h2>💬 Chatga kirish</h2>
    <label>Ismingiz
      <input type="text" id="nameInput" maxlength="20" placeholder="Masalan: Ali" required style="width:100%;margin-top:4px">
    </label>
    <label>Xona nomi
      <input type="text" id="roomInput" maxlength="30" value="umumiy" required style="width:100%;margin-top:4px">
    </label>
    <button type="submit">Kirish</button>
  </form>
</div>

<div class="app">
  <header>
    <h1 id="roomTitle">Chat</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Ulanmoqda...</span></div>
  </header>
  <div id="messages"></div>
  <form id="chatForm">
    <input type="text" id="msgInput" placeholder="Xabar yozing..." autocomplete="off" maxlength="500" disabled>
    <button type="submit" id="sendBtn" disabled>Yuborish</button>
  </form>
</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
  // Bepul ommaviy MQTT broker (server kerak emas). Xabarlar saqlanmaydi.
  const BROKER = "wss://broker.hivemq.com:8884/mqtt";
  // Boshqalar bilan to'qnashmaslik uchun o'zingizga xos prefiks qo'ying:
  const PREFIX = "uz-html-chat-demo-9f3k2";

  const $ = (id) => document.getElementById(id);
  const messagesEl = $("messages");
  let client, topic, myId = Math.random().toString(36).slice(2), myName = "";

  function addSystem(text) {
    const d = document.createElement("div");
    d.className = "sys"; d.textContent = text;
    messagesEl.appendChild(d); scrollDown();
  }

  function addMessage(m) {
    const mine = m.id === myId;
    const d = document.createElement("div");
    d.className = "msg " + (mine ? "me" : "other");
    if (!mine) {
      const n = document.createElement("div");
      n.className = "name"; n.textContent = m.name; d.appendChild(n);
    }
    const t = document.createElement("div");
    t.textContent = m.text; d.appendChild(t);
    const tm = document.createElement("div");
    tm.className = "time";
    tm.textContent = new Date(m.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    d.appendChild(tm);
    messagesEl.appendChild(d); scrollDown();
  }

  function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function setOnline(on) {
    $("dot").classList.toggle("on", on);
    $("statusText").textContent = on ? "Onlayn" : "Ulanmoqda...";
    $("msgInput").disabled = !on; $("sendBtn").disabled = !on;
  }

  function start(name, room) {
    myName = name;
    const safeRoom = room.toLowerCase().replace(/[^a-z0-9_-]/g, "") || "umumiy";
    topic = PREFIX + "/" + safeRoom;
    $("roomTitle").textContent = "# " + safeRoom;

    client = mqtt.connect(BROKER, { clientId: "c_" + myId, reconnectPeriod: 2000 });

    client.on("connect", () => {
      setOnline(true);
      client.subscribe(topic, () => addSystem("Xonaga ulandingiz: " + safeRoom));
      $("msgInput").focus();
    });
    client.on("reconnect", () => setOnline(false));
    client.on("close", () => setOnline(false));
    client.on("message", (_t, payload) => {
      try {
        const m = JSON.parse(payload.toString());
        if (m && typeof m.text === "string" && typeof m.name === "string") addMessage(m);
      } catch (e) { /* noto'g'ri xabarni e'tiborsiz qoldirish */ }
    });
  }

  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("nameInput").value.trim();
    const room = $("roomInput").value.trim();
    if (!name) return;
    try { localStorage.setItem("chat_name", name); } catch (_) {}
    $("login").style.display = "none";
    start(name, room);
  });

  $("chatForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("msgInput").value.trim();
    if (!text || !client || !client.connected) return;
    client.publish(topic, JSON.stringify({ id: myId, name: myName, text, ts: Date.now() }));
    $("msgInput").value = "";
  });

  try { const saved = localStorage.getItem("chat_name"); if (saved) $("nameInput").value = saved; } catch (_) {}
</script>
</body>
</html>
